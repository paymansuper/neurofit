<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NeuroFit – Kostenloses Gehirnjogging für alle Altersklassen. Sudoku, Kopfrechnen, Logik, Merkspiele und mehr. Ohne Anmeldung, ohne Datensammlung.">
  <title>NeuroFit – Gehirnjogging für alle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f6df5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="Zur Startseite">🧠 <span>NeuroFit</span></button>
    <span class="pill streak-pill" id="streak-pill" hidden>🔥 0</span>
    <nav class="topnav">
      <button data-nav="home">Übungen</button>
      <button data-nav="adventure">🗺️ Abenteuer</button>
      <button data-nav="stats">Meine Statistik</button>
      <button data-nav="settings">Einstellungen</button>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <p>NeuroFit ist kostenlos & Open Source. Keine Anmeldung, keine Datensammlung – dein Fortschritt bleibt nur auf deinem Gerät.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
